      <rect x="105" y="0" width="92" height="42" rx="5" class="cell"/><text x="151" y="27" class="value">4</text>
      <rect x="210" y="0" width="92" height="42" rx="5" class="cell"/><text x="256" y="27" class="value">7</text>
      <rect x="315" y="0" width="92" height="42" rx="5" class="cell"/><text x="361" y="27" class="value">11</text>
