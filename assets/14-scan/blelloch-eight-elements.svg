      <rect x="105" y="0" width="92" height="42" rx="5" class="changed"/><text x="151" y="27" class="value">0</text>
      <rect x="210" y="0" width="92" height="42" rx="5" class="cell"/><text x="256" y="27" class="value">7</text>
      <rect x="315" y="0" width="92" height="42" rx="5" class="changed"/><text x="361" y="27" class="value">4</text>
      <rect x="420" y="0" width="92" height="42" rx="5" class="cell"/><text x="466" y="27" class="value">4</text>
      <rect x="525" y="0" width="92" height="42" rx="5" class="changed"/><text x="571" y="27" class="value">11</text>
      <rect x="630" y="0" width="92" height="42" rx="5" class="cell"/><text x="676" y="27" class="value">6</text>
