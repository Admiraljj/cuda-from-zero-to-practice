      <text x="46" y="27" class="value">3</text><text x="151" y="27" class="value">4</text><text x="256" y="27" class="value">7</text><text x="361" y="27" class="value">11</text>
      <text x="466" y="27" class="value">4</text><text x="571" y="27" class="value">5</text><text x="676" y="27" class="value">6</text>
