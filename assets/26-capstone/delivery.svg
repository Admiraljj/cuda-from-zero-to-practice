<text x="85" y="172" font-size="24">规格与小手算 → CPU reference → 输入/输出/错误/预算契约</text><text x="85" y="307" font-size="24">最小 GPU 实现 → 边界/数值/所有权检查 → Sanitizer</text><text x="85" y="442" font-size="24">相同任务基线 → 可信计时 → profiler 假设/证据 → 再验证</text><text x="85" y="577" font-size="24">干净构建与测试 → README/运行记录 → 他人复现 → 独立解释</text>
