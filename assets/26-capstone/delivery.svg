<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#1e1e1e"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#d4d4d4"><text x="50" y="55" font-size="28">毕业项目不是一个 kernel：按证据关卡逐级交付</text>
