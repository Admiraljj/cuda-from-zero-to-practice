<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#1e1e1e"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#d4d4d4"><text x="50" y="55" font-size="28">筛选正数后平方和：先确认有效长度，再选择下一阶段范围</text>
<g fill="#292d32" stroke="#84939f" stroke-width="2"><rect x="60" y="110" width="1080" height="95" rx="8"/><rect x="60" y="245" width="1080" height="95" rx="8"/><rect x="60" y="380" width="1080" height="95" rx="8"/><rect x="60" y="515" width="1080" height="95" rx="8"/></g>
<text x="85" y="167" font-size="24">input [-2,0,3,-1,4] → CUB stable select → selected [3,4]</text><text x="85" y="302" font-size="24">count D2H + stream wait → host count=2；其余容量不是有效数据</text><text x="85" y="437" font-size="24">按实际 count 查询 workspace；平方 iterator → 64-bit sum=25</text><text x="85" y="572" font-size="24">完成后回传 → 检查选中顺序、sum、guard 与输入快照</text>
<g stroke="#aab8c4" stroke-width="3"><path d="M600 208V240"/><path d="M600 343V375"/><path d="M600 478V510"/></g><text x="65" y="667" font-size="21" fill="#b4c6af">count=0 定义 sum=0；不读 selected[0]，不把未初始化容量送进 reduction。</text></g></svg>
