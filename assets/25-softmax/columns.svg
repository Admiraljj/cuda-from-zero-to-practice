<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#1e1e1e"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#d4d4d4">
<text x="50" y="55" font-size="28">教学模型：一行 10 列、4 threads；tid 固定，col 在循环中变</text>
<g fill="#292d32" stroke="#84939f" stroke-width="2"><rect x="60" y="110" width="1080" height="75" rx="8"/><rect x="60" y="210" width="1080" height="75" rx="8"/><rect x="60" y="310" width="1080" height="75" rx="8"/><rect x="60" y="410" width="1080" height="75" rx="8"/></g>
<text x="90" y="158" font-size="25">thread 0：tid=0，col=0 → 4 → 8</text><text x="90" y="258" font-size="25">thread 1：tid=1，col=1 → 5 → 9</text><text x="90" y="358" font-size="25">thread 2：tid=2，col=2 → 6</text><text x="90" y="458" font-size="25">thread 3：tid=3，col=3 → 7</text>
<text x="65" y="555" font-size="23">row 来自 blockIdx.x；base=row*cols；每项地址为 input[base+col]。</text><text x="65" y="605" font-size="23" fill="#b4c6af">每个 thread 有自己的 local_max/local_sum；shared[tid] 是本 block 的槽。</text><text x="65" y="655" font-size="21">另一个 block 的 tid 又从 0 开始；不是前一行线程编号继续增长。</text></g></svg>
